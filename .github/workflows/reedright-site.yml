# Generated by reedright (https://reedright.info). Builds a browsable site of this brain with Quartz and publishes
# it to GitHub Pages on every push to main. The repository stays the source of truth; the site is a
# cache of it. Delete this file and .github/reedright/ to stop publishing.
name: reedright site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: reedright-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the brain
        uses: actions/checkout@v4
        with:
          path: brain
          fetch-depth: 0
      - name: Check out Quartz
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v4.5.2
          path: quartz
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quartz/package-lock.json
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Quartz
        working-directory: quartz
        run: npm ci
      - name: Prepare content
        env:
          SITE_TITLE: "Live it Up brain"
          BASE_URL: ${{ steps.pages.outputs.host }}${{ steps.pages.outputs.base_path }}
        run: node brain/.github/reedright/site-prep.mjs brain quartz
      - name: Build the site
        working-directory: quartz
        run: npx quartz build -d ../brain -o public
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
